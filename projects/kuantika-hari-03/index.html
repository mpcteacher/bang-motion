  color:#E5484D;font:900 170px/1 Nunito,system-ui,sans-serif;letter-spacing:.04em;opacity:0;box-shadow:0 14px 0 rgba(11,37,69,.3)}
#dbg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:none;gap:12px;align-items:center;padding:10px 16px;border-radius:14px;background:rgba(11,37,69,.92);color:#E0F2FE;font:13px system-ui;z-index:50}

<body>
<div id="stage">
  <div id="world"><svg id="scene" width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0" font-family="Nunito,system-ui,sans-serif"></svg></div>
  <div id="ui">
    <div class="cap" id="tHook"><span class="ln"><span class="w">Petir</span> <span class="w">tak</span></span><span class="ln"><span class="w y">menyambar</span> <span class="w o">2 kali?</span></span></div>

    <div class="cap" id="tEnd"><span class="ln"><span class="w">Paham</span> <span class="w">sampai</span></span><span class="ln"><span class="w">ke</span> <span class="w y">inti!</span></span></div>

</div>
<div id="dbg"><button id="dPlay">Pause</button><input id="dScrub" type="range" min="0" max="1000" value="0"><span id="dClock">0.00s</span></div>
<audio id="vo" src="vo.m4a" preload="auto"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const W=1080,H=1920,DUR=50.2,NS='http://www.w3.org/2000/svg';
/* palet brand Kuantika (logo kit) + turunan */
const B={blue:'#0EA5E9',orange:'#FF7A59',yellow:'#FFD23F',navy:'#0B2545',pale:'#E0F2FE',white:'#FFFFFF',cheek:'#94A3B8'};
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}addEventListener('resize',fit);fit();

/* ---------- penyusun bentuk ---------- */
const S=$('#scene');
function N(tag,a={},p=S){const n=document.createElementNS(NS,tag);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n;}
const G=(a={},p=S)=>N('g',a,p),R=(x,y,w,h,f,rx=0,p=S,a={})=>N('rect',{x,y,width:w,height:h,rx,fill:f,...a},p),
  CI=(cx,cy,r,f,p=S,a={})=>N('circle',{cx,cy,r,fill:f,...a},p),EL=(cx,cy,rx,ry,f,p=S,a={})=>N('ellipse',{cx,cy,rx,ry,fill:f,...a},p),
  PA=(d,f,p=S,a={})=>N('path',{d,fill:f||'none',...a},p),
  LN=(d,st,w,p=S,a={})=>N('path',{d,fill:'none',stroke:st,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',...a},p),
  TX=(x,y,t,size,f,p=S,a={})=>{const n=N('text',{x,y,'font-size':size,fill:f,'font-weight':900,'text-anchor':'middle',...a},p);n.textContent=t;return n;};
const hx=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];};
const mix=(a,b,t)=>{const A=hx(a),Bb=hx(b);t=Math.max(0,Math.min(1,t));return 'rgb('+A.map((v,i)=>Math.round(v+(Bb[i]-v)*t)).join(',')+')';};
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};   // deterministik, bukan Math.random
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mixH=(a,b,t)=>{const A=hx(a),Bb=hx(b);return '#'+A.map((v,i)=>Math.round(v+(Bb[i]-v)*t).toString(16).padStart(2,'0')).join('');};
const defs=N('defs',{},S);
function lin(id,cols,offs,{x1=0,y1=0,x2=0,y2=1,user=false}={}){const g=N('linearGradient',{id,x1,y1,x2,y2,...(user?{gradientUnits:'userSpaceOnUse'}:{})},defs);
  return cols.map((c,i)=>N('stop',{offset:offs[i],'stop-color':c},g));}
function rad(id,cols,offs,ops){const g=N('radialGradient',{id},defs);return cols.map((c,i)=>N('stop',{offset:offs[i],'stop-color':c,'stop-opacity':ops?ops[i]:1},g));}
const star4=(x,y,r,f,p)=>{const g=G({},p),j=J(g,x,y);PA(`M 0 ${-r} Q 0 0 ${r} 0 Q 0 0 0 ${r} Q 0 0 ${-r} 0 Q 0 0 0 ${-r} Z`,f,g);return j;};

/* SENDI: transform ditulis manual (sumbu putar = titik asal lokal, bukan bbox) */
const JS=[],APPLY=[],LOOPS=[];
function J(el,tx=0,ty=0){const j={el,tx,ty,x:0,y:0,r:0,sx:1,sy:1,apply(){el.setAttribute('transform',`translate(${j.tx+j.x},${j.ty+j.y}) rotate(${j.r}) scale(${j.sx},${j.sy})`);}};j.apply();JS.push(j);return j;}

/* ---------- panggung: satu frame per adegan, kamera sendiri ---------- */
const scenes=[];
function scene(name){const g=G({'data-name':name},S);g.style.display='none';const sc={name,g,cam:{x:540,y:960,z:1.12,ox:0,oy:0}};
  sc.apply=()=>{const c=sc.cam;g.setAttribute('transform',`translate(${540-(c.x+c.ox)*c.z},${960-(c.y+c.oy)*c.z}) scale(${c.z})`);};
  sc.on=()=>g.style.display!=='none';APPLY.push(sc.apply);scenes.push(sc);return sc;}
const loop=(sc,f)=>LOOPS.push(t=>{if(sc.on())f(t);});

/* ---------- KUAN: partikel biru bercincin, digambar ulang dari lembar maskot ---------- */
function kuan(p,x,y,s,{face='senang',ph=0,helmet=false,sc}={}){
  const place=G({transform:`translate(${x},${y})`},p);
  const mvEl=G({},place),mv=J(mvEl);mv.sx=mv.sy=s;mv.apply();       // gerak besar (tween)
  const bobEl=G({},mvEl),bob=J(bobEl);                                 // melayang (fungsi waktu)
  const sqEl=G({},bobEl),sq=J(sqEl);                                   // squash/pop (tween)
  const k={mv,bob,sq,orbit:{a:0},faces:{},eyes:[],stars:[],ph,s};
  const RING='rotate(-16) translate(0,12)';
  const back=G({transform:RING},sqEl);LN('M -128 0 A 128 34 0 0 1 128 0',B.orange,13,back);k.ballB=CI(128,0,17,B.yellow,back);
  LN('M -2 -76 C -8 -94 -2 -110 13 -105',B.blue,10,sqEl);
  CI(0,0,80,B.blue,sqEl);
  const F=n=>{const g=G({opacity:n===face?1:0},sqEl);k.faces[n]=g;return g;};
  const eye=(g,cx,px,py,ry=20)=>{const eg=G({},g),ej=J(eg,cx,-14);k.eyes.push(ej);EL(0,0,17,ry,B.white,eg);CI(px,py,8.5,B.navy,eg);CI(px+3,py-3.5,2.8,B.white,eg);};
  const cheeks=g=>{CI(-50,10,10,B.cheek,g,{opacity:.75});CI(50,10,10,B.cheek,g,{opacity:.75});};
  {const g=F('senang');eye(g,-24,3,-3);eye(g,24,3,-3);cheeks(g);LN('M -15 20 Q 0 32 15 20',B.navy,6,g);}
  {const g=F('kaget');eye(g,-24,0,1,22);eye(g,24,0,1,22);LN('M -40 -46 Q -25 -57 -10 -46',B.navy,5,g);LN('M 10 -46 Q 25 -57 40 -46',B.navy,5,g);EL(0,27,9,12,B.navy,g);
    [['M -104 -100 L -88 -80'],['M -122 -52 L -100 -46'],['M 104 -104 L 90 -84']].forEach(([d])=>LN(d,B.orange,6,g));}
  {const g=F('berpikir');eye(g,-24,-5,-6);eye(g,24,-5,-6);LN('M 12 -46 L 40 -54',B.navy,6,g);LN('M -13 28 Q -6 21 1 26 T 14 24',B.navy,5,g);
    const tb=G({},g);CI(-86,-74,6,B.white,tb,{stroke:B.navy,'stroke-width':4});CI(-106,-98,10,B.white,tb,{stroke:B.navy,'stroke-width':4});
    CI(-146,-142,32,B.white,tb,{stroke:B.navy,'stroke-width':5});TX(-146,-129,'?',38,B.navy,tb);}
  {const g=F('eureka');LN('M -38 -10 Q -24 -28 -10 -10',B.navy,6,g);LN('M 10 -10 Q 24 -28 38 -10',B.navy,6,g);cheeks(g);
    PA('M -24 10 L 24 10 Q 22 42 0 42 Q -22 42 -24 10 Z',B.navy,g);EL(0,35,11,6,B.orange,g);
    k.stars.push(star4(-112,-98,20,B.yellow,g),star4(106,-142,15,B.yellow,g));}
  {const g=F('bangga');eye(g,-24,2,-2);LN('M 10 -12 Q 24 -26 38 -12',B.navy,6,g);cheeks(g);
    PA('M -20 14 L 20 14 Q 18 35 0 35 Q -18 35 -20 14 Z',B.navy,g);k.stars.push(star4(104,-134,20,B.yellow,g));}
  {const g=F('guru');eye(g,-24,1,-2);eye(g,24,1,-2);PA('M -18 14 L 18 14 Q 16 33 0 33 Q -16 33 -18 14 Z',B.navy,g);
    R(-48,-104,96,32,B.navy,8,g);PA('M -104 -112 L 0 -148 L 104 -112 L 0 -78 Z',B.navy,g);PA('M -104 -112 L 0 -148 L 104 -112 L 0 -78 Z','none',g,{stroke:'#1E3A5F','stroke-width':4,'stroke-linejoin':'round'});
    CI(0,-113,7,B.yellow,g);LN('M 0 -113 L 64 -100 L 70 -62',B.yellow,5,g);CI(70,-58,9,B.yellow,g);}
  {const g=F('bingung');eye(g,-24,-2,2);eye(g,24,-3,3,17);LN('M -44 -50 L -12 -40',B.navy,6,g);LN('M 12 -44 L 42 -52',B.navy,6,g);
    LN('M -16 28 Q -8 20 0 28 T 16 28',B.navy,5,g);PA('M 74 -92 Q 60 -66 74 -58 Q 88 -66 74 -92 Z','#BAE6FD',g,{stroke:B.navy,'stroke-width':4,'stroke-linejoin':'round'});}
  {const g=F('ups');eye(g,-24,0,5);eye(g,24,0,5);LN('M -42 -40 L -12 -52',B.navy,6,g);LN('M 12 -52 L 42 -40',B.navy,6,g);
    LN('M -16 32 Q 0 20 16 32',B.navy,6,g);PA('M -44 4 Q -52 20 -44 26 Q -36 20 -44 4 Z','#BAE6FD',g,{stroke:B.navy,'stroke-width':3});}
  const front=G({transform:RING},sqEl);LN('M -128 0 A 128 34 0 0 0 128 0',B.orange,13,front);k.ballF=CI(128,0,17,B.yellow,front);
  if(helmet){CI(0,-4,152,B.white,sqEl,{opacity:.16});CI(0,-4,152,'none',sqEl,{stroke:B.white,'stroke-width':7,opacity:.75});
    LN('M -104 -84 Q -74 -126 -22 -138',B.white,12,sqEl,{opacity:.8});R(-66,134,132,26,'#CBD5E1',12,sqEl);}
  /* jejak kilau tanda tangan "lompat orbit" */
  k.trail=[0,1,2,3,4].map(i=>{const a=Math.PI*(.15+i*.38),j=star4(150*Math.cos(a)*-1,-40+60*Math.sin(a)-60,12+(i%2)*6,B.yellow,sqEl);j.sx=j.sy=0;j.apply();return j;});
  LOOPS.push(t=>{if(sc&&!sc.on())return;const q=t+ph;bob.y=-9*Math.sin(q*2.4);bob.r=2.2*Math.sin(q*1.6+.7);
    const a=k.orbit.a+q*2.2,bx=128*Math.cos(a),by=34*Math.sin(a);
    k.ballB.setAttribute('cx',bx);k.ballB.setAttribute('cy',by);k.ballF.setAttribute('cx',bx);k.ballF.setAttribute('cy',by);
    const fr=Math.sin(a)>0;k.ballF.setAttribute('opacity',fr?1:0);k.ballB.setAttribute('opacity',fr?0:1);
    const bl=((q+1.6+ph*1.7)%3.7)<.12;k.eyes.forEach(e=>e.sy=bl?.1:1);
    k.stars.forEach((st,i)=>{st.sx=st.sy=.82+.25*Math.sin(q*6+i*2);st.r=8*Math.sin(q*3+i);});});
  return k;}

/* ---------- mesin animasi ---------- */
const tl=gsap.timeline({paused:true}),world=$('#world');
const cam=(sc,at,x,y,z,dur=1.4,ease='sine.inOut')=>tl.to(sc.cam,{x,y,z,duration:dur,ease},at);
const camSet=(sc,at,x,y,z)=>tl.set(sc.cam,{x,y,z},at);
function cut(at,from,to){tl.set(from.g,{display:'none'},at);tl.set(to.g,{display:'block'},at);}
function slide(at,from,to,axis='x',dist=axis==='x'?96:72){const o=axis==='x'?'ox':'oy';
  tl.fromTo(from.cam,{[o]:0},{[o]:-dist,duration:.28,ease:'power2.in',immediateRender:false},at);tl.set(to.cam,{[o]:dist},at+.28);cut(at+.28,from,to);
  tl.to(to.cam,{[o]:0,duration:.42,ease:'power3.out'},at+.28);
  const b={v:0};tl.fromTo(b,{v:0},{v:10,duration:.28,ease:'power2.in',immediateRender:false,onUpdate(){world.style.filter=`blur(${b.v}px)`}},at);
  tl.to(b,{v:0,duration:.42,ease:'power3.out',onUpdate(){world.style.filter=b.v>.05?`blur(${b.v}px)`:'none'}},at+.28);}
function face(k,name,at){for(const n in k.faces)tl.to(k.faces[n],{opacity:n===name?1:0,duration:.06},at);
  tl.fromTo(k.sq,{sx:1.14,sy:.88},{sx:1,sy:1,duration:.55,ease:'elastic.out(1,.45)',immediateRender:false},at);}
function hop(k,at,h=90){tl.to(k.mv,{y:`-=${h}`,duration:.26,ease:'power2.out'},at);tl.to(k.mv,{y:`+=${h}`,duration:.5,ease:'bounce.out'},at+.26);
  tl.to(k.orbit,{a:`+=${Math.PI*2}`,duration:.75,ease:'power2.inOut'},at);
  tl.fromTo(k.sq,{sx:.9,sy:1.12},{sx:1,sy:1,duration:.6,ease:'elastic.out(1,.4)',immediateRender:false},at);
  k.trail.forEach((j,i)=>{tl.fromTo(j,{sx:0,sy:0},{sx:1.15,sy:1.15,duration:.22,ease:'back.out(3)',immediateRender:false},at+.12+i*.06);
    tl.to(j,{sx:0,sy:0,duration:.3,ease:'power2.in'},at+.5+i*.06);});}
/* teks per kata: masuk dari bawah, regang vertikal + blur berarah, keluar ke atas */
function say(sel,at,st=.11){tl.fromTo($$(sel+' .w'),{opacity:0,y:80,scaleY:1.5,scaleX:.8,filter:'blur(14px)'},
  {opacity:1,y:0,scaleY:1,scaleX:1,filter:'blur(0px)',duration:.5,ease:'back.out(2)',stagger:st,immediateRender:false},at);}
function unsay(sel,at){tl.to($$(sel+' .w'),{opacity:0,y:-60,scaleY:1.4,filter:'blur(12px)',duration:.28,ease:'power2.in',stagger:.035},at);}

/* =====================================================================
   PERKAKAS BADAI — petir, hujan, kilatan, stempel, guncangan
   ===================================================================== */
const RED='#E5484D',GREEN='#22C55E',STORM={top:'#16223F',mid:'#2B3A5E',low:'#4A5679',cloud:'#4B5578',cloud2:'#5E6890',rain:'#BFE3F8'};
const sayAt=(sel,times)=>$$(sel+' .w').forEach((w,i)=>tl.fromTo(w,{opacity:0,y:80,scaleY:1.5,scaleX:.8,filter:'blur(14px)'},
  {opacity:1,y:0,scaleY:1,scaleX:1,filter:'blur(0px)',duration:.5,ease:'back.out(2)',immediateRender:false},times[i]));
/* jalur zig-zag deterministik dari (x0,y0) ke (x1,y1) */
function zig(x0,y0,x1,y1,n,amp,seed){let d=`M ${x0} ${y0}`;for(let i=1;i<n;i++){const q=i/n;d+=` L ${(x0+(x1-x0)*q+(hash(seed+i)-.5)*amp).toFixed(1)} ${(y0+(y1-y0)*q).toFixed(1)}`;}return d+` L ${x1} ${y1}`;}
/* satu petir: cahaya luar + inti kuning + inti putih, plus cabang */
function bolt(p,x0,y0,x1,y1,seed,{n=9,amp=90,branches=2}={}){const g=G({opacity:0},p);const main=zig(x0,y0,x1,y1,n,amp,seed);
  const ds=[main];for(let b=0;b<branches;b++){const q=.25+b*.3,bx=x0+(x1-x0)*q+(hash(seed+20+b)-.5)*amp,by=y0+(y1-y0)*q;
    ds.push(zig(bx,by,bx+(b%2?1:-1)*(120+hash(seed+b)*80),by+180+hash(seed+30+b)*120,4,50,seed+40+b));}
  ds.forEach((d,i)=>{LN(d,B.yellow,i?14:30,g,{opacity:.35});LN(d,B.yellow,i?5:12,g);LN(d,'#FFFBEA',i?2:5,g);});return g;}
/* sambaran: kedip cepat */
function strike(g,at,flash){tl.fromTo(g,{opacity:0},{keyframes:{opacity:[0,1,.25,1,.6,0],easeEach:'none'},duration:.42,immediateRender:false},at);
  if(flash)tl.fromTo(flash,{opacity:0},{keyframes:{opacity:[0,.75,.1,.45,0],easeEach:'none'},duration:.42,immediateRender:false},at);}
/* pemimpin bertingkat: petir tumbuh dari awan ke bawah, lalu sambaran balik */
function leader(g,at,dur=1.0){const ps=[...g.querySelectorAll('path')];ps.forEach(pth=>{const L=pth.getTotalLength();pth.setAttribute('stroke-dasharray',L);
  tl.fromTo(pth,{attr:{'stroke-dashoffset':L}},{attr:{'stroke-dashoffset':0},duration:dur,ease:'steps(9)',immediateRender:false},at);});
  tl.fromTo(g,{opacity:0},{opacity:.55,duration:.05,immediateRender:false},at);}
const flashRect=p=>R(-500,-600,2100,3200,'#FFFFFF',0,p,{opacity:0});
function rain(sc,p,n=70,speed=1900,slant=-.18,col=STORM.rain,op=.5){const ls=[];for(let i=0;i<n;i++)ls.push({l:N('line',{stroke:col,'stroke-width':3+hash(i+5)*2,'stroke-linecap':'round',opacity:op*(.5+hash(i+7)*.5)},p),i,x:-200+hash(i)*1500,o:hash(i+3)*2600,len:50+hash(i+11)*50});
  loop(sc,t=>{ls.forEach(r=>{const y=((r.o+t*speed)%2600)-400,x=r.x+y*slant;r.l.setAttribute('x1',x);r.l.setAttribute('y1',y);r.l.setAttribute('x2',x-r.len*slant);r.l.setAttribute('y2',y+r.len);});});}
function cloudBank(sc,p,y,col,seed,n=5,scale=1){const g=G({},p),j=J(g);for(let i=0;i<n;i++){const x=-200+i*330+hash(seed+i)*90,r=(130+hash(seed+i+9)*80)*scale;CI(x,y+hash(seed+i+3)*40,r,col,g);}
  R(-500,y-600,2100,600,col,0,g);loop(sc,t=>{j.x=40*Math.sin(t*.25+seed);});return j;}
function shake(sc,at,a=16){tl.to(sc.cam,{keyframes:{ox:[0,-a,a*.8,-a*.5,a*.3,0],oy:[0,a*.5,-a*.6,a*.4,-a*.2,0]},duration:.42,ease:'none'},at);}
function sign(p,x,y,ok){const P=G({transform:`translate(${x},${y})`},p),el=G({},P),j=J(el);j.sx=j.sy=0;j.apply();CI(0,0,62,ok?GREEN:RED,el);CI(0,0,62,'none',el,{stroke:B.white,'stroke-width':8});
  if(ok)LN('M -28 2 L -8 24 L 30 -22',B.white,14,el);else LN('M -24 -24 L 24 24 M 24 -24 L -24 24',B.white,14,el);return j;}
const pop=(j,at,s=1)=>tl.fromTo(j,{sx:0,sy:0},{sx:s,sy:s,duration:.5,ease:'back.out(2.6)',immediateRender:false},at);
function slam(sel,at){const el=$(sel);gsap.set(el,{xPercent:-50,rotation:-12,opacity:0});

/* ---------- kontrol: autoplay + loop tanpa player; ?debug=1 panel; ?clean=1 export ---------- */
function applyAll(){const t=tl.time();LOOPS.forEach(f=>f(t));APPLY.forEach(f=>f());JS.forEach(j=>j.apply());}
tl.eventCallback('onUpdate',applyAll);
const q=new URLSearchParams(location.search),vo=$('#vo'),hasVO=!!vo.getAttribute('src');let audioOn=false;
function start(){tl.play(0);if(hasVO){vo.currentTime=0;vo.play().then(()=>audioOn=true).catch(()=>{});}}
tl.eventCallback('onComplete',()=>{if(!q.has('clean'))start();});
gsap.ticker.add(()=>{if(!audioOn||tl.paused())return;if(Math.abs(vo.currentTime-tl.time())>.12)vo.currentTime=tl.time();});
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);applyAll();},play:start};
window.OPENER.seekFrame=t=>{window.OPENER.seek(t);return Promise.resolve();};
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
if(q.has('debug')){const dbg=$('#dbg');dbg.style.display='flex';const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
  gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
  sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
  sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);applyAll();});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
document.fonts.ready.then(()=>{layoutWord();tl.render(0,false,true);applyAll();window.OPENER.ready=true;if(q.has('clean'))return;if(!hasVO){start();return;}
  vo.play().then(()=>{audioOn=true;vo.currentTime=0;tl.play(0);}).catch(()=>{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);start();};addEventListener('pointerdown',go);addEventListener('keydown',go);});});
</script>
